<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>For The Company — 기술 스택</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&family=Geist+Mono&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{background:#ffffff;color:#000000;margin:0;padding:24px;
       font-family:Geist,'Malgun Gothic',sans-serif}
</style>
</head>
<body>
<svg viewBox="0 0 760 600" width="760" height="600" role="img" aria-labelledby="ts-title ts-desc"
     font-family="Geist,'Malgun Gothic',sans-serif">
  <title id="ts-title">개발 도구 및 기술 구성</title>
  <desc id="ts-desc">AI 도구 Claude Code가 Unity 6 기반 교육용 게임 개발을 보조하는 기술 스택 구조.</desc>

  <defs>
    <marker id="m-ink" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 8 3, 0 6" fill="#000000"/>
    </marker>
  </defs>

  <!-- ══ AI 도구 ══ -->
  <g>
    <rect x="200" y="16" width="360" height="64" rx="6" fill="#ffffff"
          stroke="#000000" stroke-width="1"/>
    <text x="380" y="45" font-size="16" font-weight="600" text-anchor="middle" fill="#000000">Claude Code (Fable 5)</text>
    <text x="380" y="67" font-family="'Geist Mono',Consolas,monospace" font-size="12" text-anchor="middle" fill="#000000">개발 · 콘텐츠 생성 보조</text>
  </g>

  <!-- AI → 게임 클라이언트 -->
  <path d="M380,80 V115" stroke="#000000" stroke-width="1.2" fill="none" marker-end="url(#m-ink)"/>

  <!-- ══ 게임 클라이언트 컨테이너 (실선) ══ -->
  <rect x="32" y="120" width="696" height="464" rx="8" fill="#ffffff"
        stroke="#000000" stroke-width="1"/>

  <!-- Row 1: 엔진 -->
  <g>
    <rect x="64" y="152" width="632" height="64" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1"/>
    <text x="380" y="181" font-size="16" font-weight="600" text-anchor="middle" fill="#000000">Unity 6 · URP</text>
    <text x="380" y="203" font-family="'Geist Mono',Consolas,monospace" font-size="12" text-anchor="middle" fill="#000000">C# 기반 개발 · 6000.4.7f1</text>
  </g>

  <!-- Row 2: 입력 / 화면 -->
  <g>
    <rect x="64" y="240" width="304" height="64" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1"/>
    <text x="216" y="269" font-size="16" font-weight="600" text-anchor="middle" fill="#000000">입력 처리</text>
    <text x="216" y="291" font-family="'Geist Mono',Consolas,monospace" font-size="12" text-anchor="middle" fill="#000000">New Input System</text>
  </g>
  <g>
    <rect x="392" y="240" width="304" height="64" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1"/>
    <text x="544" y="269" font-size="16" font-weight="600" text-anchor="middle" fill="#000000">화면 구성</text>
    <text x="544" y="291" font-family="'Geist Mono',Consolas,monospace" font-size="12" text-anchor="middle" fill="#000000">IMGUI (OnGUI)</text>
  </g>

  <!-- Row 3: 미니게임 / 리소스 -->
  <g>
    <rect x="64" y="328" width="304" height="64" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1"/>
    <text x="216" y="357" font-size="16" font-weight="600" text-anchor="middle" fill="#000000">미니게임</text>
    <text x="216" y="379" font-family="'Geist Mono',Consolas,monospace" font-size="12" text-anchor="middle" fill="#000000">HTML5 · UnityWebBrowser</text>
  </g>
  <g>
    <rect x="392" y="328" width="304" height="64" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1"/>
    <text x="544" y="357" font-size="16" font-weight="600" text-anchor="middle" fill="#000000">리소스</text>
    <text x="544" y="379" font-family="'Geist Mono',Consolas,monospace" font-size="12" text-anchor="middle" fill="#000000">공개 에셋 — Kenney · Synty</text>
  </g>

  <!-- Row 4: MCP 연동 -->
  <g>
    <rect x="64" y="416" width="632" height="64" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1"/>
    <text x="380" y="445" font-size="16" font-weight="600" text-anchor="middle" fill="#000000">Unity MCP · Claude Code 연동</text>
    <text x="380" y="467" font-family="'Geist Mono',Consolas,monospace" font-size="12" text-anchor="middle" fill="#000000">C# 스크립트 생성 · 수정 보조</text>
  </g>

  <!-- Row4 → Row5 -->
  <path d="M380,480 V499" stroke="#000000" stroke-width="1.2" fill="none" marker-end="url(#m-ink)"/>

  <!-- Row 5: 결과물 (강조 — 굵은 테두리) -->
  <g>
    <rect x="64" y="504" width="632" height="56" rx="6" fill="#ffffff" stroke="#000000" stroke-width="2.4"/>
    <text x="380" y="538" font-size="17" font-weight="600" text-anchor="middle" fill="#000000">산업보안 추리 게임 《For The Company》</text>
  </g>
</svg>
</body>
</html>
