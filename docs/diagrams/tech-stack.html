<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>For The Company — 기술 스택</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Geist:wght@400;600&family=Geist+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#faf7f2; --ink:#1c1917; --muted:#4f5d75;
    --accent:#b5523a; --accent-tint:#f4e5de;
    --rule:rgba(45,49,66,.10);
  }
  *{box-sizing:border-box}
  body{background:var(--paper);color:var(--ink);margin:0;padding:36px 44px;
       font-family:Geist,'Malgun Gothic',sans-serif}
  .eyebrow{font-family:'Geist Mono',Consolas,monospace;font-size:11px;
           letter-spacing:.14em;color:var(--muted)}
  h1{font-family:'Instrument Serif','Batang',serif;font-weight:400;
     font-size:28px;margin:6px 0 20px}
</style>
</head>
<body>
<div class="eyebrow">FOR THE COMPANY // TECH STACK</div>
<h1>개발 도구 및 기술 구성</h1>

<svg viewBox="0 0 720 616" width="720" height="616" role="img" aria-labelledby="ts-title ts-desc"
     font-family="Geist,'Malgun Gothic',sans-serif">
  <title id="ts-title">개발 도구 및 기술 구성</title>
  <desc id="ts-desc">AI 도구 Claude Code가 Unity 6 기반 독립 실행형 교육용 게임 개발을 보조하는 기술 스택 구조.</desc>

  <defs>
    <marker id="m-muted" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
  </defs>

  <!-- ══ 연결 (zone보다 나중, 노드보다 먼저 그려도 무방하나 여기선 zone 다음) ══ -->

  <!-- ══ Zone 1: AI 도구 ══ -->
  <rect x="40" y="24" width="640" height="100" rx="8" fill="rgba(45,49,66,.02)"
        stroke="rgba(45,49,66,.10)" stroke-width="0.8"/>
  <rect x="304" y="18" width="112" height="12" rx="2" fill="#faf7f2"/>
  <text x="360" y="27" font-family="'Geist Mono',Consolas,monospace" font-size="7"
        letter-spacing=".14em" text-anchor="middle" fill="#4f5d75">AI TOOLING</text>

  <g>
    <rect x="200" y="48" width="320" height="56" rx="6" fill="rgba(28,25,23,.03)"
          stroke="rgba(28,25,23,.30)" stroke-width="1"/>
    <text x="360" y="72" font-size="12" font-weight="600" text-anchor="middle" fill="#1c1917">Claude Code (Fable 5)</text>
    <text x="360" y="90" font-family="'Geist Mono',Consolas,monospace" font-size="9" text-anchor="middle" fill="#4f5d75">개발 · 콘텐츠 생성 보조</text>
  </g>

  <!-- AI → 게임 클라이언트 -->
  <path d="M360,124 V146" stroke="#4f5d75" stroke-width="1" fill="none" marker-end="url(#m-muted)"/>

  <!-- ══ Zone 2: 교육용 게임 ══ -->
  <rect x="40" y="152" width="640" height="440" rx="8" fill="rgba(45,49,66,.02)"
        stroke="rgba(45,49,66,.10)" stroke-width="0.8"/>
  <rect x="220" y="146" width="280" height="12" rx="2" fill="#faf7f2"/>
  <text x="360" y="155" font-family="'Geist Mono',Consolas,monospace" font-size="7"
        letter-spacing=".14em" text-anchor="middle" fill="#4f5d75">교육용 게임 — 독립 실행형 클라이언트</text>

  <!-- Row 1: 엔진 -->
  <g>
    <rect x="72" y="180" width="576" height="56" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
    <text x="360" y="204" font-size="12" font-weight="600" text-anchor="middle" fill="#1c1917">Unity 6 · URP</text>
    <text x="360" y="222" font-family="'Geist Mono',Consolas,monospace" font-size="9" text-anchor="middle" fill="#4f5d75">C# 기반 개발 · 6000.4.7f1</text>
  </g>

  <!-- Row 2: 입력 / 화면 -->
  <g>
    <rect x="72" y="260" width="276" height="56" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
    <text x="210" y="284" font-size="12" font-weight="600" text-anchor="middle" fill="#1c1917">입력 처리</text>
    <text x="210" y="302" font-family="'Geist Mono',Consolas,monospace" font-size="9" text-anchor="middle" fill="#4f5d75">New Input System</text>
  </g>
  <g>
    <rect x="372" y="260" width="276" height="56" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
    <text x="510" y="284" font-size="12" font-weight="600" text-anchor="middle" fill="#1c1917">화면 구성</text>
    <text x="510" y="302" font-family="'Geist Mono',Consolas,monospace" font-size="9" text-anchor="middle" fill="#4f5d75">IMGUI (OnGUI)</text>
  </g>

  <!-- Row 3: 미니게임 / 리소스 -->
  <g>
    <rect x="72" y="340" width="276" height="56" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
    <text x="210" y="364" font-size="12" font-weight="600" text-anchor="middle" fill="#1c1917">미니게임</text>
    <text x="210" y="382" font-family="'Geist Mono',Consolas,monospace" font-size="9" text-anchor="middle" fill="#4f5d75">HTML5 · UnityWebBrowser(CEF)</text>
  </g>
  <g>
    <rect x="372" y="340" width="276" height="56" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
    <text x="510" y="364" font-size="12" font-weight="600" text-anchor="middle" fill="#1c1917">리소스</text>
    <text x="510" y="382" font-family="'Geist Mono',Consolas,monospace" font-size="9" text-anchor="middle" fill="#4f5d75">공개 에셋 — Kenney · Synty · Pixabay</text>
  </g>

  <!-- Row 4: MCP 연동 -->
  <g>
    <rect x="72" y="420" width="576" height="56" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
    <text x="360" y="444" font-size="12" font-weight="600" text-anchor="middle" fill="#1c1917">Unity MCP · Claude Code 연동</text>
    <text x="360" y="462" font-family="'Geist Mono',Consolas,monospace" font-size="9" text-anchor="middle" fill="#4f5d75">C# 스크립트 생성 · 수정 보조</text>
  </g>

  <!-- Row4 → Row5 -->
  <path d="M360,476 V498" stroke="#4f5d75" stroke-width="1" fill="none" marker-end="url(#m-muted)"/>

  <!-- Row 5: 결과물 (FOCAL) -->
  <g>
    <rect x="72" y="504" width="576" height="60" rx="6" fill="#f4e5de" stroke="#b5523a" stroke-width="1.2"/>
    <text x="360" y="530" font-size="13" font-weight="600" text-anchor="middle" fill="#1c1917">산업보안 추리 게임 《For The Company》</text>
    <text x="360" y="550" font-family="'Geist Mono',Consolas,monospace" font-size="9" text-anchor="middle" fill="#b5523a">3D 탐정 어드벤처 × 보안 교육 · Windows 클라이언트</text>
  </g>
</svg>
</body>
</html>
